<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLedger — Your Household Budget</title>
<meta name="description" content="HomeLedger is a simple, private household budget planner: track income and spending, set category budgets, save toward goals, and see where every dollar goes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='5' fill='%231d5c46'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='%23f7f3ea' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect x="2" y="4" width="28" height="24" rx="5" fill="#1d5c46"/><path d="M9 12h14M9 17h14M9 22h8" stroke="#f7f3ea" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text"><strong>HomeLedger</strong><small>every dollar has a job</small></span>
    </a>
    <nav class="mainnav" aria-label="Main sections">
      <a href="#/" data-nav="dashboard">Dashboard</a>
      <a href="#/transactions" data-nav="transactions">Transactions</a>
      <a href="#/budgets" data-nav="budgets">Budgets</a>
      <a href="#/goals" data-nav="goals">Goals</a>
      <a href="#/insights" data-nav="insights">Insights</a>
    </nav>
    <div class="top-actions">
      <label class="month-picker" for="monthSelect">Month
        <select id="monthSelect" aria-label="Choose month"></select>
      </label>
      <button class="btn btn-primary" id="addBtn" type="button">+ Add transaction</button>
    </div>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p><strong>HomeLedger</strong> — a household budget planner that lives entirely in your browser. Your numbers are stored on this device only, never sent anywhere.</p>
    <p class="footer-links"><a href="#/">Dashboard</a> · <a href="#/transactions">Transactions</a> · <a href="#/budgets">Budgets</a> · <a href="#/goals">Goals</a> · <a href="#/insights">Insights</a> · <button class="linklike" id="resetDemo" type="button">Reset demo data</button></p>
  </div>
</footer>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add a transaction</h2>
    <form id="txForm">
      <div class="field-row">
        <label class="field">Type
          <select id="txType" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label class="field">Date
          <input id="txDate" name="date" type="date" required>
        </label>
      </div>
      <label class="field">Description
        <input id="txDesc" name="description" type="text" placeholder="e.g. Weekly shop at GreenMart" maxlength="80" required>
      </label>
      <div class="field-row">
        <label class="field">Category
          <select id="txCategory" name="category"></select>
        </label>
        <label class="field">Amount ($)
          <input id="txAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
        </label>
      </div>
      <p class="form-error" id="formError" hidden></p>
      <div class="modal-actions">
        <button class="btn" id="cancelBtn" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Save transaction</button>
      </div>
    </form>
  </section>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
